# version 속성은 Docker Compose V2에서 더 이상 필요하지 않음

# MING Stack - 라즈베리파이 4/5 최적화 구성
# Mosquitto + InfluxDB + Node-RED + Grafana

services:
  # =============================================================================
  # MQTT Broker - Eclipse Mosquitto
  # =============================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ming-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ming-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Time-Series Database - InfluxDB 2.x
  # =============================================================================
  influxdb:
    image: influxdb:2.7
    container_name: ming-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin123456}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-ming-org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-factory}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-ming-super-secret-token}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-7d}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    networks:
      - ming-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Flow Programming - Node-RED
  # =============================================================================
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: ming-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=${TIMEZONE:-Asia/Seoul}
      - NODE_RED_CREDENTIAL_SECRET=${NODERED_CREDENTIAL_SECRET:-ming-secret-key}
    volumes:
      - ./nodered/data:/data
    networks:
      - ming-network
    depends_on:
      - mosquitto
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Visualization - Grafana
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ming-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ming-network
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Industrial Protocol Simulators
  # =============================================================================

  # Modbus TCP Simulator
  modbus-simulator:
    build:
      context: ./nodered/simulators/modbus
      dockerfile: Dockerfile
    container_name: ming-modbus-simulator
    restart: unless-stopped
    ports:
      - "5020:5020"     # Modbus TCP
    networks:
      - ming-network

  # OPC-UA Simulator
  opcua-simulator:
    build:
      context: ./nodered/simulators/opcua
      dockerfile: Dockerfile
    container_name: ming-opcua-simulator
    restart: unless-stopped
    ports:
      - "4840:4840"     # OPC-UA
    networks:
      - ming-network

  # S7 PLC Simulator (Siemens)
  s7-simulator:
    build:
      context: ./nodered/simulators/s7
      dockerfile: Dockerfile
    container_name: ming-s7-simulator
    restart: unless-stopped
    ports:
      - "102:102"       # S7 Protocol
    networks:
      - ming-network

networks:
  ming-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  influxdb-data:
  grafana-data:
  nodered-data:
  mosquitto-data:
