# =============================================================================
# Eclipse Mosquitto Configuration
# MING Stack - 산업용 IoT 플랫폼
# 라즈베리파이 4/5 최적화
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information

# -----------------------------------------------------------------------------
# Default Listener (MQTT)
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# 인증 설정
# 첫 실행 시 scripts/init-mosquitto.sh로 비밀번호 생성 필요
allow_anonymous false
password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# WebSocket Listener
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# Security Settings
# -----------------------------------------------------------------------------
# ACL (Access Control List) 설정
acl_file /mosquitto/config/acl

# -----------------------------------------------------------------------------
# Performance Settings (Raspberry Pi 5 최적화)
# -----------------------------------------------------------------------------
# 최대 연결 수
max_connections 1000

# 메시지 크기 제한 (1MB)
message_size_limit 1048576

# 큐 크기 제한
max_queued_messages 1000
max_queued_bytes 0

# 인플라이트 메시지
max_inflight_messages 20
max_inflight_bytes 0

# Keep-alive 설정
max_keepalive 120

# -----------------------------------------------------------------------------
# Persistence Settings
# -----------------------------------------------------------------------------
autosave_interval 300
autosave_on_changes true

# 세션 만료 시간 (1일)
persistent_client_expiration 1d

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------
# 연결 메시지 표시
connection_messages true

# 타임스탬프 로그
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
