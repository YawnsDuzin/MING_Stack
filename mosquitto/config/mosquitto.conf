# =============================================================================
# Eclipse Mosquitto Configuration
# MING Stack - 산업용 IoT 플랫폼
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# -----------------------------------------------------------------------------
# Default Listener (MQTT)
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# 인증 설정 (프로덕션 환경에서는 반드시 활성화)
allow_anonymous false
password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# WebSocket Listener
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# Security Settings
# -----------------------------------------------------------------------------
# ACL (Access Control List) 설정
acl_file /mosquitto/config/acl

# -----------------------------------------------------------------------------
# Performance Settings (Raspberry Pi 최적화)
# -----------------------------------------------------------------------------
# 최대 연결 수
max_connections 500

# 메시지 크기 제한 (1MB)
message_size_limit 1048576

# 큐 크기 제한
max_queued_messages 1000

# Keep-alive 설정
max_keepalive 120

# -----------------------------------------------------------------------------
# Persistence Settings
# -----------------------------------------------------------------------------
autosave_interval 300
autosave_on_changes true

# 세션 만료 시간 (1일)
persistent_client_expiration 1d
